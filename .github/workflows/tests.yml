name: tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CPU PyTorch for contract tests
        run: uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,full,aef,location,benchmark]"

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python -m pytest tests -v -n 2
